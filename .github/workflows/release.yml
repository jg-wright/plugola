name: Release

# Publishes a package to npm whenever release-please (release-please.yml)
# creates its GitHub release. Dispatch by hand with a tag to retry a failed
# publish. This file name is registered as the npm trusted publisher.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. logger-v5.0.4
        required: true

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}

run-name: Release ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - id: parser
        uses: jg-wright/regex-action@v2.0.2
        with:
          ref: refs/tags/${{ env.TAG }}
          regex: ^refs/tags/(?P<package>[a-zA-Z0-9_-]+)-v(?P<version>\d+\.\d+\.\d+)$
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - working-directory: packages/${{ fromJSON(steps.parser.outputs.groups).package }}
        run: npm publish
